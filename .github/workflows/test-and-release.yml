name: Test and Release BotSORT + OpenCV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ==========================================
      #   ANDROID SDK / NDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.1.12297006'

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # ==========================================
      #   OPENCV CACHING ENGINE
      # ==========================================
      - name: Cache OpenCV Static Libraries
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: |
            android/src/main/cpp/libs
          key: ${{ runner.os }}-opencv-4.12.0-arm64-v8a-ndk27.1-${{ hashFiles('.github/workflows/test-and-release.yml') }}

      # ==========================================
      #   BUILD OPENCV (Runs if cache misses)
      # ==========================================
      - name: Clone OpenCV Source Code
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.12.0 https://github.com/opencv/opencv opencv-source

      - name: Build Ultra-Lean OpenCV for arm64-v8a
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          cd opencv-source
          mkdir build
          cd build

          cmake \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NATIVE_API_LEVEL=24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_INSTALL_PREFIX=../../android/src/main/cpp/libs/arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-Os -fdata-sections -ffunction-sections" \
            -DCMAKE_CXX_FLAGS_RELEASE="-Os -fdata-sections -ffunction-sections" \
            -DBUILD_LIST=core,imgproc,calib3d \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_JAVA=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_opencv_java=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DOPENCV_ENABLE_NONFREE=OFF \
            -DOPENCV_DISABLE_THREAD_SUPPORT=ON \
            -DWITH_FFMPEG=OFF \
            -DWITH_GTK=OFF \
            -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_QUIRC=OFF \
            -DWITH_EIGEN=OFF \
            -DWITH_ITT=OFF \
            -DWITH_IPP=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_VULKAN=OFF \
            -DWITH_OPENGL=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_VTK=OFF \
            -DWITH_GDAL=OFF \
            -DBUILD_ZLIB=OFF \
            -DWITH_ZLIB=ON \
            -DBUILD_PNG=OFF \
            -DWITH_PNG=OFF \
            -DBUILD_JPEG=OFF \
            -DWITH_JPEG=OFF \
            -DBUILD_TIFF=OFF \
            -DWITH_TIFF=OFF \
            -DBUILD_WEBP=OFF \
            -DWITH_WEBP=OFF \
            -DBUILD_OPENJPEG=OFF \
            -DWITH_OPENJPEG=OFF \
            ..

          ninja install

      # ==========================================
      #   VERIFY OPENCV STATIC LIBRARIES
      # ==========================================
      - name: Verify OpenCV Static Libraries
        run: |
          echo "=========================================================="
          echo "             OPENCV STATIC LIBRARIES"
          echo "=========================================================="

          find android/src/main/cpp/libs/arm64-v8a \
            -type f \
            -name "*.a" \
            -exec ls -lh {} +

          echo "=========================================================="

      # ==========================================
      #   TEST PASS: GENERATE & COMPILE MODULE
      # ==========================================
      - name: Install Package JavaScript Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Nitrogen Binding Generator
        run: yarn run specs

      - name: Compile Native Module
        run: |
          cd example/android
          ./gradlew assembleRelease

      # ==========================================
      #   MEASURE FINAL NATIVE BINARY SIZE
      # ==========================================
      - name: Measure Final Native Binary Size
        run: |
          echo "=========================================================="
          echo "       FINAL STRIPPED BOTSORT + OPENCV BINARY SIZE"
          echo "=========================================================="

          NATIVE_DIR="example/android/build/intermediates/merged_native_libs/release/out/lib/arm64-v8a"

          if [ -d "$NATIVE_DIR" ]; then
            echo ""
            echo "Native libraries:"
            find "$NATIVE_DIR" \
              -type f \
              -name "*.so" \
              -exec ls -lh {} +

            echo ""
            echo "Detailed file information:"
            find "$NATIVE_DIR" \
              -type f \
              -name "*.so" \
              -exec file {} +

            echo ""
            echo "Total native library size:"
            du -ch "$NATIVE_DIR"/*.so 2>/dev/null | tail -n 1
          else
            echo "ERROR: Native library directory not found."
            echo "Searching build output:"
            find android/build/ -name "*.so" -exec ls -lh {} +
            exit 1
          fi

          echo "=========================================================="

      # ==========================================
      #   RELEASE PASS: PACKAGE ONLY ON TAGS
      # ==========================================
      - name: Clean Up Workspace Before Packaging
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf opencv-source

          # find android/src/main/cpp/libs/arm64-v8a/ \
          #   -type f \
          #   ! -name '*.a' \
          #   -delete 2>/dev/null || true

      - name: Create Release ZIP Archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r react-native-botsort-opencv-arm64.zip \
            src \
            android \
            nitrogen \
            lib \
            cpp \
            ios \
            nitro.json \
            package.json \
            yarn.lock \
            NitroBotsort.podspec \
            react-native.config.js \
            -x "**/build/*" \
            -x "**/.gradle/*" \
            -x "**/node_modules/*" \
            -x "**/.git/*"

      # ==========================================
      #   UPLOAD RELEASE
      # ==========================================
      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: react-native-botsort-opencv-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
