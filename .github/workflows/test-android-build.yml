name: Test BotSORT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ==========================================
      #   ANDROID SDK / NDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-26 ndk;27.1.12297006'

      # ==========================================
      #   TEST PASS: GENERATE & COMPILE MODULE
      # ==========================================
      - name: Install Package JavaScript Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nitrogen Binding Generator
        run: pnpm run specs

      - name: Compile Native Module
        run: |
          cd example/android
          ./gradlew assembleRelease

      # ==========================================
      #   MEASURE FINAL NATIVE BINARY SIZE
      # ==========================================
      - name: Measure Final Native Binary Size
        run: |
          echo "=========================================================="
          echo "       FINAL STRIPPED BOTSORT + OPENCV BINARY SIZE"
          echo "=========================================================="

          NATIVE_DIR="example/android/build/intermediates/merged_native_libs/release/out/lib/arm64-v8a"

          if [ -d "$NATIVE_DIR" ]; then
            echo ""
            echo "Native libraries:"
            find "$NATIVE_DIR" \
              -type f \
              -name "*.so" \
              -exec ls -lh {} +

            echo ""
            echo "Detailed file information:"
            find "$NATIVE_DIR" \
              -type f \
              -name "*.so" \
              -exec file {} +

            echo ""
            echo "Total native library size:"
            du -ch "$NATIVE_DIR"/*.so 2>/dev/null | tail -n 1
          else
            echo "ERROR: Native library directory not found."
            echo "Searching build output:"
            find example/android/build/ -name "*.so" -exec ls -lh {} +
            exit 1
          fi

          echo "=========================================================="
