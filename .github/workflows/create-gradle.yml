name: Generate Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate Gradle Wrapper
        working-directory: example/android
        run: |
          gradle wrapper --gradle-version 9.3.1

      - name: Verify Gradle Wrapper
        run: |
          ls -lh example/android/gradlew
          ls -lh example/android/gradlew.bat
          ls -lh example/android/gradle/wrapper/

      - name: Commit Gradle Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add example/android/gradlew
          git add example/android/gradlew.bat
          git add example/android/gradle/wrapper

          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "Add Gradle wrapper"
          git push
